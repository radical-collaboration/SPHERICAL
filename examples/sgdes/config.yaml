# =============================================================================
# SGDES Workflow Configuration — MAYV mutations
# =============================================================================

# ── Telemetry ─────────────────────────────────────────────────────────────────
collect_nvml_telemetry:    true          # per-node GPU util via NVML (all nodes)
collect_dragon_telemetry:  true          # Dragon runtime metrics (dragon engine only)
nvml_dir:                  "nvml-telemetry"
dragon_telemetry_dir:      "dragon-telemetry"
nvml_collection_rate:      1.0
nvml_checkpoint_interval:  30.0

# ── Paths ─────────────────────────────────────────────────────────────────────
# outdir: base directory; the workflow appends {mutation}_wd automatically.
outdir:    "/scratch/bblj/mgoliyad1/SPHERICAL/examples/sgdes/mayv_output"
query_dir: "/scratch/bblj/mgoliyad1/SGDES/results/mayv/splited_mayv"
wt_query:  "/scratch/bblj/mgoliyad1/SGDES/data/mayv_ori.fasta"

# ── Execution ─────────────────────────────────────────────────────────────────
engine:          dragon # concurrent (asyncio) or dragon
# total_gpus is set automatically by delta_gpu_sbatch.sh via TOTAL_GPUS env var (nodes × gpus-per-node)
foldtune_rounds: 3
fast_folding:    true
fold_batch_size: 1
RNG_seed:        42

# ── DES hyperparameters ───────────────────────────────────────────────────────
des_rounds:        3
des_batch_size:    100
des_num_sequences: 50
num_mutations:     1
topk:              10

# ── All 50 MAYV mutations (from run_sgdes_for_mayv.sh) ───────────────────────
