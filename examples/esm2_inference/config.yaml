# =============================================================================
# ESM2 Inference Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Model Settings
# -----------------------------------------------------------------------------
model_path: "facebook/esm2_t33_650M_UR50D"
cache_dir: "cache"

# -----------------------------------------------------------------------------
# GPU / Service Configuration
# -----------------------------------------------------------------------------
num_services: 2   # Not to exceed number of requested nodes
num_gpus_per_service: 8
num_workers_per_gpu: 2

# -----------------------------------------------------------------------------
# Server Settings
# -----------------------------------------------------------------------------
server_port: 8000
use_https: false


# -----------------------------------------------------------------------------
# Inference Settings
# -----------------------------------------------------------------------------
max_concurrent: 3200
timeout: 600
inference_timeout: 300
max_retries: 3

# -----------------------------------------------------------------------------
# Batch Settings
# -----------------------------------------------------------------------------
num_batches: 3200
max_batch_tokens: 20000
use_streaming: false
health_check_timeout: 300  # seconds to wait for servers (default 300)

# -----------------------------------------------------------------------------
# Output Settings
# -----------------------------------------------------------------------------
output_dir: "data/outputs_16gpu"
results_dir: "data/outputs_16gpu/results"
telemetry_dir: "data/outputs_16gpu/telemetry-results"
metrics_dir: "data/outputs_16gpu"
metrics_file_prefix: "metrics"
metrics_log_interval: 20

# -----------------------------------------------------------------------------
# Sequences (for testing/demo)
# -----------------------------------------------------------------------------
SEQUENCES:
  - STANHFNAYKLTRPYVAYCADCGMGHSCHSPAMIENIQADATDGTLK
  - MKTFFVLLLAGAGAG
  - MASQDVKIVVLGGLG
  - MVHLTPEEKSAVTALWGKV

# -----------------------------------------------------------------------------
# Execution Settings (concurrent, dragon)
# -----------------------------------------------------------------------------
debug: false
engine: dragon
dragon_workers: 2500
collect_telemetry: true
slurm_config: slurm.yaml