# =============================================================================
# ESM2 Inference Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Model Settings
# -----------------------------------------------------------------------------
model_path: "facebook/esm2_t33_650M_UR50D"
cache_dir: "cache"

# -----------------------------------------------------------------------------
# GPU / Service Configuration
# -----------------------------------------------------------------------------
num_services: 1   # Not to exceed number of requested nodes
num_gpus_per_service: 1
num_cpus_per_service: 64
num_workers_per_gpu: 1

# -----------------------------------------------------------------------------
# Server Settings
# -----------------------------------------------------------------------------
server_port: 8000
use_https: false


# -----------------------------------------------------------------------------
# Inference Settings
# -----------------------------------------------------------------------------
max_concurrent: 3200
timeout: 600
inference_timeout: 300
max_retries: 3

# -----------------------------------------------------------------------------
# Batch Settings
# -----------------------------------------------------------------------------
num_batches: 32
max_batch_tokens: 20000
use_streaming: false
health_check_timeout: 300  # seconds to wait for servers (default 300)

# -----------------------------------------------------------------------------
# Output Settings
# -----------------------------------------------------------------------------
output_dir: "data/outputs_test"
results_dir: "data/outputs_test/results"
telemetry_dir: "data/outputs_test/telemetry-results"
metrics_dir: "data/outputs_test"
metrics_file_prefix: "metrics"
metrics_log_interval: 20

# -----------------------------------------------------------------------------
# Sequences (for testing/demo)
# -----------------------------------------------------------------------------
SEQUENCES:
  - STANHFNAYKLTRPYVAYCADCGMGHSCHSPAMIENIQADATDGTLK
  - MKTFFVLLLAGAGAG
  - MASQDVKIVVLGGLG
  - MVHLTPEEKSAVTALWGKV

# -----------------------------------------------------------------------------
# Execution Settings (concurrent, dragon)
# -----------------------------------------------------------------------------
debug: false
engine: concurrent
dragon_workers: 2500
collect_telemetry: true
slurm_config: slurm.yaml

# -----------------------------------------------------------------------------
# Task configuration for ResourceManager (if enabled)
# -----------------------------------------------------------------------------
tasks_config: 
    client_req:
        priority:       0
        ranks:          1
        cores_per_rank: 1
        gpus_per_rank:  1

ddsim_config: "/ocean/projects/dmr170002p/goliyad/DeepDriveSim/pipelines/ddmd_pipeline/data/new_lassen-keras-dbscan.yaml"