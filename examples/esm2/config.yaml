# =============================================================================
# ESM2 Inference Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Model Settings
# -----------------------------------------------------------------------------
model_path: "facebook/esm2_t33_650M_UR50D"
cache_dir: "cache"

# -----------------------------------------------------------------------------
# GPU / Service Configuration
# -----------------------------------------------------------------------------
num_services: 1   # Not to exceed number of requested nodes
num_gpus_per_service: 4
num_workers_per_gpu: 4

# -----------------------------------------------------------------------------
# Server Settings
# -----------------------------------------------------------------------------
server_port: 8000
use_https: false

# -----------------------------------------------------------------------------
# Inference Settings
# -----------------------------------------------------------------------------
max_concurrent: 200
timeout: 600
inference_timeout: 300
max_retries: 3

# -----------------------------------------------------------------------------
# Batch Settings
# -----------------------------------------------------------------------------
num_batches: 5
max_batch_tokens: 2000
use_streaming: false

# -----------------------------------------------------------------------------
# Output Settings
# -----------------------------------------------------------------------------
output_dir: "data/outputs_8gpu"
results_dir: "data/outputs_8gpu/results"
telemetry_dir: "data/outputs_8gpu/telemetry-results"
metrics_dir: "data/outputs_8gpu"
metrics_file_prefix: "metrics"
metrics_log_interval: 1

# -----------------------------------------------------------------------------
# Sequences (for testing/demo)
# -----------------------------------------------------------------------------
SEQUENCES:
  - STANHFNAYKLTRPYVAYCADCGMGHSCHSPAMIENIQADATDGTLK
  - MKTFFVLLLAGAGAG
  - MASQDVKIVVLGGLG
  - MVHLTPEEKSAVTALWGKV

# -----------------------------------------------------------------------------
# Execution Settings
# -----------------------------------------------------------------------------
debug: false
engine: concurrent
dragon_workers: 2500
collect_telemetry: true
slurm_config: slurm.yaml