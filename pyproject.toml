[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spherical"
version = "0.1.0"
description = "Multi-GPU Inference Service Framework with Worker Pool Management"

authors = [
    {name = "Masha", email = "mg2347@soe.rutgers.edu"},
]
maintainers = [
    {name = "Masha", email = "mg2347@soe.rutgers.edu"},
]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "aiohttp>=3.8.0",
    "pyyaml>=6.0",
    "radical.asyncflow>=0.3.0",
    "rhapsody-py>=0.2.0",
    "nvidia-ml-py"
]

[project.urls]
Homepage = "https://github.com/masha/spherical"
Issues = "https://github.com/masha/spherical/issues"

[project.optional-dependencies]
# ESM2 model support
esm2 = [
    "torch>=2.0.0,<2.4.0",
    "transformers>=4.30.0",
    "numpy>=1.24.0,<2.0.0",
]

# Dragon/RADICAL support
dragon = [
    "dragonhpc>=0.13.2",
    "rhapsody-py>=0.2.0",
    "nvidia-ml-py"
]

# SGDES workflow (examples/sgdes) — PyPI-available deps only.
# PyTorch+CUDA and foldseek/seqkit binaries must be installed separately;
# see examples/sgdes/requirements.txt and delta_env_setup.sh / bridges2_env_setup.sh.
sgdes = [
    "biopython>=1.81",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "numpy>=1.26.3,<2.0.0",
    "pandas",
    "PyYAML>=6.0",
    "tqdm>=4.65.0",
    "gin-config>=0.5.0",
    "absl-py>=2.0.0",
    "psutil>=5.9.0",
    "radical.asyncflow>=0.3.1",
    "rhapsody-py>=0.2.0",
    "dragonhpc>=0.13.2",
    "tensorflow==2.16.2",
    "tf-keras==2.16.0",
    "jax[cuda12]==0.4.25",
    "jaxlib==0.4.25",
    "ml-dtypes==0.3.2",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "fair-esm>=2.0.0",
    "biotite>=0.39.0",
    "sentencepiece>=0.1.99",
]

# ADR bridge — drive campaign scheduling from a radical.adr Policy.
# radical.adr is not yet on PyPI; install editable:  pip install -e ../radical.adr
# The LLM policy additionally needs the `llm` extra below.
adr = [
    "radical.adr",
    "pydantic>=2",
]

# LLM-driven scheduling policy (LLMSchedulingPolicy)
llm = [
    "openai>=1.0.0",
    "instructor>=1.0.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "anyio>=4.0.0",
    "ruff>=0.1.0",
    "numpy>=1.24.0,<2.0.0",
]

# Documentation
doc = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]

# Plotting/metrics visualization
plotting = [
    "matplotlib>=3.7.0",
    "numpy>=1.24.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "examples*"]

[tool.pyright]
pythonVersion = "3.10"
include = ["."]
extraPaths = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP"]
ignore = ["UP007", "UP045", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# Two async styles coexist in the suite: most tests use anyio (the `anyio`
# marker + anyio_backend fixture, handled by anyio's pytest plugin), while the
# inference/server/utils tests use pytest-asyncio's `asyncio` marker.  Use
# strict mode so pytest-asyncio only claims tests explicitly marked @asyncio,
# leaving anyio-marked tests untouched (auto mode double-handles them).
asyncio_mode = "strict"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "example/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.codespell]
skip = ".git,.github,__pycache__,build,dist,*.egg-info,cache,outputs"
