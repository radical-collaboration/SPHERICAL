# =============================================================================
# ESM2 Inference Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Model Settings
# -----------------------------------------------------------------------------
model_path: "facebook/esm2_t33_650M_UR50D"
cache_dir: "cache"

# -----------------------------------------------------------------------------
# GPU / Service Configuration
# -----------------------------------------------------------------------------
num_services: 1   # Match concurrency_cap so each service gets its own CM-assigned GPU
num_gpus_per_service: 1
num_cpus_per_service: 64
num_workers_per_gpu: 4

# -----------------------------------------------------------------------------
# Server Settings
# -----------------------------------------------------------------------------
server_port: 8000
use_https: false


# -----------------------------------------------------------------------------
# Inference Settings
# -----------------------------------------------------------------------------
max_concurrent: 3200
timeout: 600
inference_timeout: 300
max_retries: 3

# -----------------------------------------------------------------------------
# Batch Settings
# -----------------------------------------------------------------------------
num_batches: 32
max_batch_tokens: 20000
use_streaming: false
health_check_timeout: 300  # seconds to wait for servers (default 300)

# -----------------------------------------------------------------------------
# ESM2 Settings
# -----------------------------------------------------------------------------
ESM2_dir: "ESM2"
results_dir: "ESM2/results"
telemetry: true
telemetry_dir: "ESM2/telemetry-results"
metrics_dir: "ESM2"
metrics_file_prefix: "metrics"
metrics_log_interval: 20

# -----------------------------------------------------------------------------
# Sequences (for testing/demo)
# -----------------------------------------------------------------------------
SEQUENCES:
  - STANHFNAYKLTRPYVAYCADCGMGHSCHSPAMIENIQADATDGTLK
  - MKTFFVLLLAGAGAG
  - MASQDVKIVVLGGLG
  - MVHLTPEEKSAVTALWGKV

# -----------------------------------------------------------------------------
# Execution Settings (concurrent, dragon)
# -----------------------------------------------------------------------------
debug: false
mode: server
engine: dragon
# Python executable used to launch the inference service workers.
# Must point to an env with torch + transformers (e.g. campaign_manager).
service_python: "${VE_HOME}/esm2/bin/python"

# -----------------------------------------------------------------------------
# Tmp / Scratch Settings
# -----------------------------------------------------------------------------
# tmp_dir: node-local scratch for intermediate files; set to /tmp for single-node
# or a Lustre path for multi-node (so all nodes can read shared data).
# Leave unset to skip tmp directory management.
tmp_dir: ""
clean_tmp: false   # set true to remove tmp_dir on exit