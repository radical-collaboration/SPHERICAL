# =============================================================================
# SPHERICAL Campaign Configuration
# =============================================================================

# ── Cluster Resources ─────────────────────────────────────────────────────────
resources:
  total_cpus: 64   # CPU cores on the allocated node(s)
  total_gpus: 4     # GPUs on the allocated node(s)

# ── Engine ────────────────────────────────────────────────────────────────────
engine:      dragon       # concurrent | dragon 
debug:       false         # set true to enable rhapsody DEBUG logging

# ── Telemetry ─────────────────────────────────────────────────────────────────
telemetry:
  collect_telemetry: true
  telemetry_dir: "telemetry-results"

# ── Workflow Registry ────────────────────────────────────────────────────────
# Maps config workflow names to "module.ClassName" strings.
# Modules are resolved relative to the run_campaign directory.
workflow_registry:
  dummy:     dummy_workflow.DDSimWorkflow
  md:        ddmd_workflow.DDMdWrapperWorkflow
  miniapps:  miniapps_workflow.MiniAppsWrapperWorkflow
  inference: inference_workflow.InferenceWorkflow

# ── Workflow Groups ───────────────────────────────────────────────────────────
# Each key must match a name in the workflow_registry above.
#
#   replicas          : total replicas to run
#   min_replicas      : guaranteed concurrent slots
#   max_replicas      : sliding-window cap on concurrent replicas
#   priority          : higher → scheduled before lower-priority groups
#   dependencies      : groups that must signal ready before this starts
#   dependency_threshold : fallback: unblock after N finished replicas
#   required_cpus/gpus: per-replica resource reservation
#   config_file       : path (relative to this file) to the workflow's own
#                       parameter file — merged into the config passed to the
#                       workflow constructor

workflows:

  # ── DDSim (simulation + training loop) ─────────────────────────────────────
  dummy:
    priority:             5
    replicas:             8
    min_replicas:         2
    max_replicas:         4
    required_cpus:        4
    required_gpus:        0
    dependencies:         [inference]
    config_file:          "${DUMMY_DIR}/config.yaml"

  # ── ESM2 Inference ──────────────────────────────────────────────────────────
  inference:
    priority:             6
    replicas:             8
    min_replicas:         1
    max_replicas:         4
    required_cpus:        4
    required_gpus:        1
    dependencies:         []
    dependency_threshold: 1
    config_file:          "${INF_DIR}/config.yaml"

  # ── MiniApps Workflow ────────────────────────────────────────────────────────
  miniapps:
    priority:      8
    replicas:      4
    min_replicas:  1
    max_replicas:  2
    required_cpus: 4
    required_gpus: 1
    dependencies:  [md]
    config_file:   "${MINAPPS_DIR}/config.yaml"

  # ── DDMd Workflow (real MD simulations) ──────────────────────────────────────
  md:
    priority:      10
    replicas:      4
    min_replicas:  2
    max_replicas:  4
    required_cpus: 4
    required_gpus: 1
    dependencies:  []
    config_file:   "${MD_HOME}/config.yaml"
