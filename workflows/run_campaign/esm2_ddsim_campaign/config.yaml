# =============================================================================
# SPHERICAL Campaign Configuration
# =============================================================================

# ── Cluster Resources ─────────────────────────────────────────────────────────
resources:
  total_cpus: 64   # CPU cores on the allocated node(s)
  total_gpus: 8     # GPUs on the allocated node(s) — matches gpu_sbatch.sh --gpus=8

# ── Engine ────────────────────────────────────────────────────────────────────
engine:      dragon       # concurrent | dragon 
debug:       false         # set true to enable rhapsody DEBUG logging

# ── Telemetry ─────────────────────────────────────────────────────────────────
telemetry:
  collect_telemetry: true
  telemetry_dir: "telemetry-results"
  resource_poll_interval: 0.5   # seconds between ResourceUpdate events

# ── Campaign Manager / ADR supervision ───────────────────────────────────────
# The CM scheduler orders eligible groups by group.priority.  An optional ADR
# policy drives those priorities each tick via set_priority() — the "agent
# layer" that replaces the old in-loop bandit.  On HPC runs with telemetry
# enabled the policy also sees live GPU/CPU/mem utilisation in its observation.
cm:
  adr:
    policy:  rule      # none | rule | bandit | llm  (override with --policy)
    tick_s:  2.0       # operator decision cadence (seconds)
    record:  false     # true → write adr-decisions-<policy>.jsonl each run

    # LLM policy settings (only used when policy=llm or --policy llm):
    llm_tick_s:       10.0              # slower cadence for LLM calls
    llm_timeout_s:    20.0              # per-call timeout before falling back to rule
    llm_max_retries:  0                 # instructor structured-output retries
    model:            openai/gpt-4o-mini
    llm_api_key_env:  OPENROUTER_API_KEY  # env var that holds the key
    # base_url: http://localhost:11434/v1  # uncomment for local Ollama

# ── Workflow Registry ────────────────────────────────────────────────────────
# Maps config workflow names to "module.ClassName" strings.
# Modules are resolved relative to the run_campaign directory.
workflow_registry:
  dummy:     dummy_workflow.DDSimWorkflow
  md:        ddmd_workflow.DDMdWrapperWorkflow
  miniapps:  miniapps_workflow.MiniAppsWrapperWorkflow
  inference: inference_workflow.InferenceWorkflow

# ── Workflow Groups ───────────────────────────────────────────────────────────
# Each key must match a name in the workflow_registry above.
#
# Two modes — controlled by whether 'dependencies' is set:
#
#   Independent (no dependencies):
#     replicas: N     — group starts immediately on cm.start()
#
#   Dependent (has dependencies):
#     omit 'replicas' — group starts at 0 and stays inactive until an upstream
#     replica calls  await self._trigger_dependent("name", replicas=N)
#     The upstream workflow decides *when* and *how many* based on its own
#     execution logic (e.g. 1 downstream run per result produced, or N based
#     on a quality threshold).  Each call adds N more replicas to the queue;
#     calls can repeat across the lifetime of the upstream run.
#
#   To switch a dependent group to independent: add 'replicas: N' and remove
#   'dependencies'.  No workflow code needs to change — the pipeline topology
#   lives entirely in this config.
#
# Field reference
# ---------------
#   replicas             : total replicas for independent groups; omit for dependent
#   concurrency_floor         : guaranteed concurrent slots (scheduler pass 1)
#   concurrency_cap         : sliding-window concurrency cap (scheduler pass 2)
#   priority             : higher → scheduled first when resources are contested
#   dependencies         : upstream groups this workflow depends on; also used by
#                          the CM to route _signal_done() — when group X signals
#                          done, every group listing X here gets +1 replica queued
#   dependency_threshold : N finished upstream replicas satisfies dep check when
#                          using _signal_done() fallback (default 1)
#   required_cpus/gpus   : per-replica resource reservation (ResourcePool)
#   config_file          : path to the workflow's own YAML merged into the
#                          constructor config (${VAR} expanded at load time)

workflows:

  # ── ESM2 Inference ─────────────────────────────────────────────────────────
  # Independent: starts immediately on cm.start().
  # on_replica_done triggers 1 'dummy' replica per successful inference result.
  inference:
    priority:             6
    replicas:             8
    concurrency_floor:         1
    concurrency_cap:         4
    required_cpus:        4
    required_gpus:        1
    config_file:          "${INF_DIR}/config.yaml"

  # ── DDSim ──────────────────────────────────────────────────────────────────
  # Dependent on inference: stays at replicas=0 until InferenceWorkflow calls
  # _trigger_dependent("dummy", replicas=1) for each successful result.
  # To run independently: add 'replicas: N' and remove 'dependencies'.
  dummy:
    priority:             5
    concurrency_floor:         2
    concurrency_cap:         4
    required_cpus:        4
    required_gpus:        0
    dependencies:         [inference]
    config_file:          "${DUMMY_DIR}/config.yaml"

  # ── DDMd (MD simulations) ──────────────────────────────────────────────────
  # Independent: starts immediately, runs in parallel with inference.
  # Each completed iteration calls _signal_done() → CM queues 1 miniapps replica.
  md:
    priority:      10
    replicas:      2
    concurrency_floor:  1
    concurrency_cap:  1
    required_cpus: 4
    required_gpus: 1
    config_file:   "${MD_DIR}/config.yaml"   # MD_DIR exported by gpu_sbatch.sh

  # ── MiniApps ───────────────────────────────────────────────────────────────
  # Dependent on md: stays at replicas=0 until DDMdWrapperWorkflow calls
  # _trigger_dependent("miniapps", replicas=N) based on MD results.
  # To run independently: add 'replicas: N' and remove 'dependencies'.
  miniapps:
    priority:      8
    concurrency_floor:  1
    concurrency_cap:  1
    required_cpus: 4
    required_gpus: 1
    dependencies:  [md]
    config_file:   "${MINAPPS_DIR}/config.yaml"
