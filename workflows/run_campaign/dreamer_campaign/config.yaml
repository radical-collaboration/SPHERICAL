# =============================================================================
# SPHERICAL Dreamer Campaign Plan
#
# Format: cm-prototype cm-plan/1.0  +  SPHERICAL extensions
#   Mirrors /u/mgoliyad1/cm-prototype/plans/example_campaign.yaml exactly.
#   Two SPHERICAL-specific additions:
#     cm:      — Campaign Manager runtime settings (engine, resources, registry)
#     dreamer: — radical.dreamer emulation parameters (one block per stage)
#
# Prototype fields per stage (unchanged):
#   id, upstream, downstream, budget_node_hours,
#   pilot, concurrency_cap, surrogate, downstream_input_target, variant
#
# SPHERICAL-only additions per stage:
#   sharding  — adaptive batch dispatch from the trigger buffer (see below)
#   dreamer   — radical.dreamer emulation block (num_cores, perf_dist, …)
#
# ── sharding block ────────────────────────────────────────────────────────────
# Controls how trigger_dependent() signals are batched before entering the
# runnable queue.  Only meaningful for dependent (non-root) stages.
#
#   target_size: int    Target batch size per dispatch cycle.
#                       Actual size is modulated by BP state and pilot occupancy.
#
#   min_size:    int    Hard lower bound on dispatch size (never dispatch fewer).
#
#   max_size:    int    Hard upper bound on dispatch size (never dispatch more).
#
#   stratify:    str    Batching strategy — one of:
#     off               Bypass adaptive_size entirely; always dispatch exactly 1
#                       trigger per scheduling cycle.  Useful when no batching
#                       is desired but backpressure control is still wanted.
#     soft              Adaptive sizing (BP + occupancy modulation) with tail
#                       dispatch: if the buffer holds fewer than target_size
#                       triggers, dispatch whatever is buffered immediately.
#                       Best for stages where partial batches are acceptable.
#     strict            Adaptive sizing, but HOLD the buffer until it accumulates
#                       at least target_size triggers before dispatching.
#                       A partial tail is only flushed when the upstream group
#                       is truly done (no more triggers will arrive).
#                       Best for stratified sampling stages (docking, MD) where
#                       chemical diversity within a batch matters.
#
#   use_bandit:  bool   Replace the fixed BP multipliers (0.5× THROTTLE /
#                       1.0× HOLD / 1.5× WIDEN) with a Thompson-sampling bandit
#                       that learns which multiplier leads to healthy queue depth.
#                       Arms: [0.50, 0.75, 1.00, 1.25, 1.50].
#                       Reward: HOLD→0.8, WIDEN→0.3, THROTTLE→0.1.
#                       Useful for A/B comparison: set true on one stage, false
#                       on a parallel stage with identical sharding parameters.
#
#   bandit_seed: int    Optional RNG seed for reproducible bandit exploration.
#
# ── edges / backpressure block ────────────────────────────────────────────────
# Each edge can carry a backpressure stanza that controls the downstream stage's
# queue depth via a hysteresis state machine:
#
#   high_water: int     Queue depth (triggered but not yet started) at which the
#                       controller enters THROTTLE state.  While THROTTLE, the
#                       sharder's dispatch() returns 0 — the producer side is
#                       gated, so the consumer (executor) is never blocked.
#
#   low_water:  int     Queue depth at which the controller leaves THROTTLE and
#                       enters WIDEN state (dispatch multiplier increases).
#                       Must be strictly less than high_water.
#
#   States: HOLD (normal) → THROTTLE (queue too deep) → WIDEN (queue drained)
#
# ── edges / profile ───────────────────────────────────────────────────────────
# profile maps to dreamer schedule_strategy and early_binding in run_campaign.py:
#   round_robin       random strategy, early binding  — diversity at intake
#   diverse_top       smallest_to_fastest, early bind — score + coverage
#   explore_exploit   largest_to_fastest, late bind   — score + uncertainty
#   pure_promise      largest_to_fastest, late bind   — greedy score-only
#
# ── cm / features block ───────────────────────────────────────────────────────
# Feature flags for A/B comparison — run twice with a flag flipped to isolate
# the effect of each feature:
#   backpressure  Per-edge hysteresis queue depth controller.
#                 Disabling removes all THROTTLE/WIDEN state transitions.
#   monitor       Periodic health table + pass-through and budget drift alerts.
#                 Disabling suppresses all Monitor tick logs and drift warnings.
#   sharder       Adaptive batch dispatch from the trigger buffer.
#                 Disabling means every trigger_dependent() goes directly into
#                 the runnable queue (no buffering, no BP gate).
#   bandit        Thompson-sampling cross-stage scheduling bandit.
#                 Learns which stage to prioritize when multiple are eligible
#                 simultaneously. Reward: downstream BP state after each replica.
#
# ── dreamer / perf_dist and ops_dist ─────────────────────────────────────────
# Both distributions share the same schema:
#   name:         uniform | normal
#   mean:         float   Centre of the distribution.
#   var_spatial:  float   Variance across cores/tasks (fixed at run start).
#   var_temporal: float   Variance across time steps (optional; normal only).
# =============================================================================

plan_id:        vax-funnel-dreamer/v1
campaign_id:    vax-funnel-dreamer
schema_version: cm-plan/1.0
created_at:     "2026-05-07T00:00:00Z"

# ── Campaign contract ─────────────────────────────────────────────────────────
contract:
  total_budget_node_hours: 100000
  deadline_hours:          504
  min_acceptable_yield:    50
  facility_caps:
    frontier:   70000
    perlmutter: 30000

# ── Stages ────────────────────────────────────────────────────────────────────
stages:

  # ── S1: Ligand property filter ─────────────────────────────────────────────
  # Prototype: Perlmutter GPU, 300 nodes × 24 h = 7 200 node-hours
  # GPU-bound: fast GPU-accelerated graph-NN filter (all stages GPU-bound).
  # s1 alone demands 30 GPUs > 24 available → immediately GPU-limited at 24 concurrent.
  # s1 runtime (debug): 500 × 2s ÷ 24 = 41.7s — long enough for s2→s5 pipeline to start
  # and overlap with s1 for ~26s, giving the scheduling bandit rich multi-stage decisions.
  # Pipeline latency s1→s5: 2+1+3+5+4=15s; baseline target=5 at ~57s; bandit target at ~15s.
  # Peak GPU demand: s1(24)+s2(16)+s3(12)+s4(16)+s5(6) = 74 vs 24 → 3× oversubscription.
  - id:                     s1_ligand_filter
    upstream:               library
    downstream:             s2_ml_affinity
    budget_node_hours:      7200
    pilot: { facility: perlmutter, partition: gpu, nodes: 300, walltime_h: 24 }
    concurrency_cap:        30
    concurrency_floor:           4     # guaranteed floor so s1 isn't starved by downstream priorities

    dreamer:
      use_stub:           true
      simulated_duration: 0.5    # DEBUG: 500×0.5s÷24GPU=10.4s s1 phase; pipeline latency=6s
      simulated_jitter:   0.05
      # Score cascade: s1 generates initial random score in [0,1].
      # Only candidates with score ≥ 0.60 (top 40%) enter the s2 sharder.
      # Sharding dispatches the highest-scored ones first; baseline (no sharder) dispatches FIFO.
      score_noise:        0.0    # root stage — raw screen score, no refinement
      score_threshold:    0.6    # top 40% pass → ~2000 enter s2 buffer

  # ── S2: ML affinity prediction ─────────────────────────────────────────────
  # Prototype: Perlmutter GPU, 100 nodes × 48 h = 20 000 node-hours
  # GPU-bound: ESM2/protein-ligand ML model on GPU.  Drain rate = 16 / 10 s = 1.6/s.
  # s2 runs concurrently with s3/s4/s5 → multi-stage GPU contention for scheduling bandit.
  - id:                     s2_ml_affinity
    upstream:               s1_ligand_filter
    downstream:             s3_docking
    budget_node_hours:      20000
    # Cascade target used by BudgetController.evaluate (denominator for
    # progress) — only consulted when features.budget_control: true.
    downstream_input_target: 100
    pilot: { facility: perlmutter, partition: gpu, nodes: 100, walltime_h: 48 }
    surrogate:
      model_ref:                       surrogate-s2-v1
      # Legacy keys retained for back-compat with non-budget configs.
      uncertainty_cutoff:              0.20
      cutoff_nudge_bounds:             [0.10, 0.40]
      # New keys: full Triage spec for features.budget_control: true.
      score_cutoff:                    0.50
      score_cutoff_nudge_bounds:       [0.30, 0.80]
      uncertainty_cutoff_nudge_bounds: [0.15, 0.50]
      # ADVANCE threshold — when a candidate's surrogate prediction is
      # ≥ this AND uncertainty is below cutoff, skip this stage's compute.
      # s2 is cheap (0.5s); skip only the very confident top tier.
      advance_threshold:               0.88
    concurrency_cap: 16
    # All triggers dispatched — optimisations manage scheduling, not work reduction.
    # BP throttles queue depth to prevent runaway cascade; bandit allocates GPUs.
    sharding: { target_size: 80, min_size: 8, max_size: 160, stratify: soft, use_bandit: true, bandit_seed: 42 }

    dreamer:
      use_stub:           true
      simulated_duration: 0.5    # DEBUG: was 5.0s
      simulated_jitter:   0.05
      score_noise:        0.05   # small noise: high-scored candidates stay high across stages
      score_threshold:    0.65   # ~75% of s2 inputs pass → more cascade material

  # ── S3: High-precision docking ─────────────────────────────────────────────
  # Prototype: Frontier GPU, 200 nodes × 72 h = 30 000 node-hours
  # GPU-bound: AutoDock-GPU / Glide GPU.  s2+s3+s4+s5 compete for 24 GPU slots:
  #   s2=16 GPUs, s3=12 GPUs, s4=16 GPUs, s5=6 GPUs → peak demand 50 > 24 (2× oversubscription).
  #   Scheduling bandit arbitrates the fierce 4-way contention over ~1300s overlap window.
  - id:                     s3_docking
    upstream:               s2_ml_affinity
    downstream:             s4_md_refinement
    variant:                full
    budget_node_hours:      30000
    downstream_input_target: 30
    pilot: { facility: frontier, partition: gpu, nodes: 200, walltime_h: 72 }
    surrogate:
      model_ref:                       surrogate-s3-v1
      uncertainty_cutoff:              0.25
      cutoff_nudge_bounds:             [0.15, 0.40]
      score_cutoff:                    0.55
      score_cutoff_nudge_bounds:       [0.35, 0.85]
      uncertainty_cutoff_nudge_bounds: [0.10, 0.45]
      # s3 is 1s — more expensive; lower threshold so more candidates skip.
      advance_threshold:               0.82
    concurrency_cap: 12
    sharding: { target_size: 20, min_size: 4, max_size: 40, stratify: soft, use_bandit: true, profile: diverse_top }

    dreamer:
      use_stub:           true
      simulated_duration: 1.0    # DEBUG: was 15.0s
      simulated_jitter:   0.1
      score_noise:        0.05
      score_threshold:    0.70   # ~85% of s3 inputs pass

  # ── S4: MD refinement ──────────────────────────────────────────────────────
  # Prototype: Frontier MPI+GPU, 400 nodes × 168 h = 30 000 node-hours, cap=200
  # Dependent on s3; diverse_top edge.
  - id:                     s4_md_refinement
    upstream:               s3_docking
    downstream:             s5_fep_ranking
    budget_node_hours:      30000
    downstream_input_target: 10
    pilot: { facility: frontier, partition: gpu, nodes: 400, walltime_h: 168 }
    surrogate:
      score_cutoff:                    0.60
      score_cutoff_nudge_bounds:       [0.40, 0.90]
      uncertainty_cutoff:              0.20
      uncertainty_cutoff_nudge_bounds: [0.08, 0.40]
      # s4 is 2s (MD refinement) — the most expensive non-terminal stage.
      # Bigger wall-time savings; threshold loose enough to fire frequently.
      advance_threshold:               0.75
    # DEBUG: changed mpi+gpu→gpu (1 GPU/replica instead of 2) so s4 can start when a
    # single GPU is freed — required_gpus=2 deadlocked the pipeline while s1 ran.
    concurrency_cap:        8
    sharding: { target_size: 12, min_size: 4, max_size: 24, stratify: soft, use_bandit: true }

    dreamer:
      use_stub:           true
      simulated_duration: 2.0    # DEBUG: was 30.0s
      simulated_jitter:   0.2
      score_noise:        0.05
      score_threshold:    0.75   # ~80% of s4 inputs pass

  # ── S5: FEP ranking ────────────────────────────────────────────────────────
  # Prototype: Frontier LargeMem GPU, 200 nodes × 240 h = 25 000 node-hours, cap=50
  # Dependent on s4; pure_promise edge (greedy, score-only). Terminal stage.
  - id:                     s5_fep_ranking
    upstream:               s4_md_refinement
    downstream:             final_lead_set
    budget_node_hours:      25000
    pilot: { facility: frontier, partition: largemem, nodes: 200, walltime_h: 240 }
    downstream_input_target: 5    # BudgetController denominator T
    campaign_target: 5            # early-stop: halt campaign when 5 s5 leads produced
    surrogate:
      score_cutoff:                    0.65
      score_cutoff_nudge_bounds:       [0.45, 0.92]
      uncertainty_cutoff:              0.18
      uncertainty_cutoff_nudge_bounds: [0.07, 0.35]
      # s5 (FEP, terminal) — only skip the very highest-confidence
      # candidates since this is the final ranking step.
      advance_threshold:               0.90
    concurrency_cap:         6
    sharding: { target_size: 6, min_size: 2, max_size: 12, stratify: soft, use_bandit: true }

    dreamer:
      use_stub:           true
      simulated_duration: 2.0    # DEBUG: was 22.0s
      simulated_jitter:   0.4
      score_noise:        0.05
      score_threshold:    0.80   # terminal gate; ~3% of s1 candidates expected to reach here

# ── Edges ─────────────────────────────────────────────────────────────────────
# Unchanged from prototype.
# profile → dreamer schedule_strategy via _PROFILE_STRATEGY in run_campaign.py
edges:
  # Backpressure values are expressed in local emulation scale
  # (proportional to each downstream stage's expected replica total).
  # Queue depth = replicas triggered but not yet started.
  # Throttle when depth ≥ high_water; widen when depth ≤ low_water.
  - name:       lib_to_s1
    upstream:   library
    downstream: s1_ligand_filter        # total=2000
    profile:    round_robin
    backpressure: { high_water: 2250, low_water: 1000 }
  - name:       s1_to_s2
    upstream:   s1_ligand_filter
    downstream: s2_ml_affinity          # total≈325 (500 × 0.65 — score_threshold=0.35 in dreamer)
    profile:    diverse_top
    # Debug-scale BP: set high_water above total expected so throttle only fires on genuine
    # overflow; sharding benefit comes from priority ranking, not queue control in debug runs.
    backpressure: { high_water: 500, low_water: 200 }
  - name:       s2_to_s3
    upstream:   s2_ml_affinity
    downstream: s3_docking              # total≈195  (325 × 0.60 — score_threshold=0.40)
    profile:    explore_exploit
    backpressure: { high_water: 300, low_water: 120 }
  - name:       s3_to_s4
    upstream:   s3_docking
    downstream: s4_md_refinement        # total≈107  (195 × 0.55 — score_threshold=0.45)
    profile:    diverse_top
    backpressure: { high_water: 200, low_water: 80 }
  - name:       s4_to_s5
    upstream:   s4_md_refinement
    downstream: s5_fep_ranking          # total≈107  (all pass, score_threshold=0.0)
    profile:    pure_promise
    backpressure: { high_water: 200, low_water: 80 }

# ── Bandit budget reallocation ────────────────────────────────────────────────
# Unchanged from prototype.
bandit:
  enabled: true
  update_interval_hours: 2
  per_stage_band_pct:
    s1_ligand_filter: 0.05
    s2_ml_affinity:   0.10
    s3_docking:       0.15
    s4_md_refinement: 0.10
    s5_fep_ranking:   0.05

# ── Replanning triggers ───────────────────────────────────────────────────────
# Unchanged from prototype.
replan:
  cadence_hours:              6
  budget_burn_deviation_pct:  80   # pilot costs < budget ceiling by design (safety margin);
                                   # largest gap is s2 (50×48=2400 vs 10000 nh = 76%) — alert
                                   # only on genuine overspend above this threshold
  pass_through_deviation_pct: 10   # tight: fires when strict-sharder batching delays S3
  surrogate_recall_floor:     0.90
  deadline_slip_hours:        24
  facility_outage_hours:      4

# ── Provenance ────────────────────────────────────────────────────────────────
provenance:
  cm_code_commit: dreamer-emulation
  inputs_hash:    ""
  outputs_hash:   ""
  seeds: { sharder: 19, bandit: 42 }
  containers:
    s1_ligand_filter: "ghcr.io/demo/ligand-filter@sha256:demo"
    s2_ml_affinity:   "ghcr.io/demo/ml-affinity@sha256:demo"
    s3_docking:       "ghcr.io/demo/docking@sha256:demo"
    s4_md_refinement: "ghcr.io/demo/md@sha256:demo"
    s5_fep_ranking:   "ghcr.io/demo/fep@sha256:demo"

# ── Debug / emulation overrides ──────────────────────────────────────────────
# SPHERICAL-specific parameters not in the cm-prototype schema.
# Controls the local radical.dreamer emulation; has no effect on real HPC runs.
debug:

  # Total replicas for independent (root) stages.
  # Dependent stages grow via trigger_dependent() signals from upstream.
  stage_replicas:
    s1_ligand_filter: 10000  # 10000×0.5s÷24GPU=208s s1 phase; longer overlap for bandit convergence

  # Fraction of stage-N total that becomes stage-N+1 total.
  # Gating is done by dreamer.score_threshold inside each workflow replica.
  # Each stage triggers downstream only when output_score >= score_threshold.
  # Expected funnel: 200 s1 → ~130 s2 → ~78 s3 → ~43 s4 → ~24 s5 (stops at target=5)


# ── SPHERICAL Campaign Manager runtime ───────────────────────────────────────
# Not part of the cm-prototype schema. Hoisted to top-level by the plan
# translator in run_campaign.py when a "stages" key is detected.
cm:
  # engine: concurrent | dragon
  #   concurrent — asyncio ConcurrentExecutionBackend (local, no MPI)
  #   dragon     — radical.asyncflow DragonExecutionBackendV3 (HPC, requires Dragon)
  engine: concurrent
  debug:  false

  # ── Optional feature flags ────────────────────────────────────────────────
  # Set to true to enable; false to run baseline without the feature.
  # Enables A/B comparison: run twice, once with false and once with true.
  features:
    backpressure: true   # per-edge hysteresis queue depth controller
    monitor:      true   # pass-through + budget drift detection alerts
    sharder:      true   # adaptive batch dispatch from trigger buffer
    bandit:       true   # Thompson-sampling cross-stage scheduling bandit

  # Periodic monitor tick interval (seconds).
  # Set short for local emulation so ticks appear during the ~90s campaign run.
  monitor_interval_s: 8

  resources:
    total_cpus: 1024  # 30×16(s1)+16×4(s2)+12×4(s3)+8×16(s4)+6×8(s5)=768 → 1024 with headroom
    total_gpus: 24    # s1(30×1)+s2(16×1)+s3(12×1)+s4(8×2)+s5(6×1)=74 > 24 → 3× oversubscription; all stages GPU-bound

  telemetry:
    collect_telemetry: true
    telemetry_dir: telemetry-results

  workflow_registry:
    s1_ligand_filter: dreamer_workflow.DreamerWorkflow
    s2_ml_affinity:   dreamer_workflow.DreamerWorkflow
    s3_docking:       dreamer_workflow.DreamerWorkflow
    s4_md_refinement: dreamer_workflow.DreamerWorkflow
    s5_fep_ranking:   dreamer_workflow.DreamerWorkflow
