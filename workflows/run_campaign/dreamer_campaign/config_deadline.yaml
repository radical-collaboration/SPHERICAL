    seed: 0
    base_url: https://openrouter.ai/api/v1
    model: openai/gpt-4o-mini
    llm_api_key_env: OPENROUTER_API_KEY
    # System prompt steering the LLM — edit prompts/scheduling_system_prompt.txt
